name: pitbeat
description: "A Formula 1 companion app: calendar, standings, race tracker and news."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  xml: ^7.0.1
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Files the app reads while it runs. A folder name (ending in /) means
  # every file in that folder.
  # assets/circuits: circuit shapes from the f1-circuits project by
  # Tomislav Bacinger, MIT licence (assets/circuits/LICENSE.txt).
  assets:
    - assets/circuits/
    - assets/fonts/OFL.txt

  # Titillium Web: free under the SIL Open Font License (assets/fonts/OFL.txt).
  # Each weight is its own file. lib/theme.dart makes it the app's font.
  fonts:
    - family: TitilliumWeb
      fonts:
        - asset: assets/fonts/TitilliumWeb-Regular.ttf
        - asset: assets/fonts/TitilliumWeb-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/TitilliumWeb-Bold.ttf
          weight: 700
        - asset: assets/fonts/TitilliumWeb-Black.ttf
          weight: 900
